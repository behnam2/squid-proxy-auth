name: ${COMPOSE_PROJECT_NAME:-squid-proxy-auth}

services:
  squid:
    build: .
    image: b3hnam/squid-proxy-auth:latest
    container_name: ${CONTAINER_NAME:-squidproxy}
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-3128}:3128"
    environment:
      PROXY_USERNAME: ${PROXY_USERNAME:?Set it in .env}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?Set it in .env}
      # Optional: comma-separated IPs/CIDRs allowed without auth
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      # Optional: upstream parent proxy -> "host port [extra options]"
      CACHE_PEER: ${CACHE_PEER:-}
      # Optional: 1 = force all traffic through the peer
      CACHE_PEER_NEVER_DIRECT: ${CACHE_PEER_NEVER_DIRECT:-}
    volumes:
      - squid-cache:/var/spool/squid
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':3128 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  squid-cache:
    name: ${CACHE_VOLUME_NAME:-squid-cache}
