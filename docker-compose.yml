services:
  squid:
    build: .
    image: b3hnam/squid-proxy-auth:latest
    container_name: squidproxy
    restart: unless-stopped
    ports:
      - "3128:3128"
    environment:
      PROXY_USERNAME: ${PROXY_USERNAME:?Set it in .env}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?Set it in .env}
    volumes:
      - squid-cache:/var/spool/squid
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':3128 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  squid-cache:
